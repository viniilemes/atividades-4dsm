services:
  - type: web
    name: app-scholar-backend
    runtime: node
    rootDir: Prog p disp moveis/App/backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: app-scholar-db
          property: connectionString

databases:
  - name: app-scholar-db
    plan: free
    databaseName: app_scholar
    user: app_scholar_user
    region: oregon
