services:
  - type: web
    name: app-scholar-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: true
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
